name: Daily AI Radar

on:
  schedule:
    - cron: "30 3 * * *"   # 06:30 Riyadh; GitHub may delay or skip, so retry later
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Skip if today's radar was already built (scheduled retries)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Riyadh date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$TODAY.json" ]; then
            echo "already built $TODAY"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r collector/requirements.txt
      - name: Collect and summarize
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/collect.py
      - name: Commit data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "radar: $(date -u +%Y-%m-%d)"
          git push
