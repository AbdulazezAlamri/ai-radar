<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>رادار الذكاء الاصطناعي</title>
<style>
  /* Semantic tokens (Apple system palette), light by default, dark via prefers-color-scheme */
  :root {
    color-scheme: light dark;
    /* Warm, low-saturation palette: four hue families encode category groups */
    --bg: #f6f1ea; --card: #fffdfa; --text: #2b2420; --text2: #4a403a; --muted: #7a6f66;
    --line: rgba(80,60,40,.16); --fill: rgba(120,95,70,.10); --fill2: rgba(120,95,70,.2);
    --accent: #c67a3c; --green: #7d9a6c; --red: #bf5f4a; --orange: #cf8a3e;
    --models: #c67a3c; --tools: #c67a3c; --github: #c67a3c; --research: #8f7a9b; --banking: #7d9a6c; --funding: #7d9a6c; --saudi: #bf5f4a; --hackathon: #bf5f4a; --poc: #c9931c;
    --bar: rgba(246,241,234,.86); --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1915; --card: #2d2620; --text: #f8f2e9; --text2: #e4dbcf; --muted: #b3a79a;
      --line: rgba(215,185,155,.22); --fill: rgba(235,205,175,.16); --fill2: rgba(235,205,175,.28);
      --accent: #f2b676; --green: #a9c796; --red: #e88f78; --orange: #f2b46a;
      --models: #f2b46a; --tools: #f2b46a; --github: #f2b46a; --research: #c4b0d2; --banking: #a9c796; --funding: #a9c796; --saudi: #e88f78; --hackathon: #e88f78; --poc: #f7cf5e;
      --bar: rgba(31,25,21,.84);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  svg.sym { width: 1.1em; height: 1.1em; vertical-align: -0.2em; flex: 0 0 auto; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* Toolbar: title leading, date + language + More trailing (HIG Toolbars: item groupings) */
  header { position: sticky; top: 0; z-index: 10; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top)) 16px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  h1 { font-size: 1.375rem; margin: 0; font-weight: 700; line-height: 1.2; }
  .sub { color: var(--muted); font-size: 0.8125rem; margin-top: 2px; }
  .tools { display: flex; gap: 8px; align-items: center; position: relative; }
  select { background: var(--fill); color: var(--accent); border: 0; border-radius: 10px; padding: 0 10px; min-height: 34px; font: inherit; font-size: 0.9375rem; font-weight: 600; max-width: 130px; }
  .ib { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 34px; min-height: 34px; padding: 0 9px;
    background: var(--fill); color: var(--accent); border: 0; border-radius: 10px; font-size: 0.875rem; font-weight: 600; cursor: pointer; direction: ltr; white-space: nowrap; }
  .ib::before { content: ""; position: absolute; inset: -6px; }   /* 44pt hit target without growing the glyph */
  .ib.on { background: var(--accent); color: #fff; }
  .ib.playing { background: var(--green); color: #fff; }
  .ib.more { padding: 0; }
  .ib.more::after { content: ""; position: absolute; top: -2px; inset-inline-end: -2px; width: 9px; height: 9px; border-radius: 50%; background: transparent; border: 2px solid var(--bar); }
  .ib.more.s-ok::after { background: var(--green); } .ib.more.s-syncing::after { background: var(--orange); } .ib.more.s-error::after { background: var(--red); }

  /* Pull-down menu under the More button (HIG: rare actions live in a More menu) */
  .menu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; min-width: 240px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25); z-index: 30; }
  .menu[hidden] { display: none; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 11px 12px; border: 0; background: none; border-radius: 9px; font-size: 1rem; cursor: pointer; }
  .menu button + button { border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; }
  .menu button:active { background: var(--fill); }
  .menu .st { margin-inline-start: auto; font-size: 0.8125rem; color: var(--muted); }
  .menu button.playing { color: var(--green); }

  /* Filter chips (scrolling segmented filter) */
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 10px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--text); border: 0; font-size: 0.875rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  main { padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; }
  .feed { display: flex; flex-direction: column; gap: 12px; }

  /* Cards: content first, light chrome */
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px 14px; position: relative; overflow: hidden;
    transition: height .3s ease, opacity .3s ease, margin .3s ease, padding .3s ease; }
  .card.collapsing { height: 0 !important; opacity: 0; padding-top: 0; padding-bottom: 0; margin-top: -12px; }
  .card::before { content: ""; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--c, var(--accent)); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--muted); flex-wrap: wrap; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: color-mix(in srgb, var(--c, var(--accent)) 20%, transparent); color: var(--c, var(--accent)); }
  .pill.poc { --c: var(--poc); }
  .card h2 { font-size: 1.0625rem; margin: 10px 0 6px; line-height: 1.45; font-weight: 600; unicode-bidi: plaintext; }
  .card p { margin: 0; font-size: 0.9375rem; line-height: 1.7; color: var(--text2); unicode-bidi: plaintext; }
  .card[data-lang="ar"] h2, .card[data-lang="ar"] p { direction: rtl; text-align: right; }
  .stub .t { unicode-bidi: plaintext; }
  .lt { unicode-bidi: isolate; direction: ltr; }
  .lt.nb { white-space: nowrap; }
  .why { margin-top: 10px !important; font-size: 0.875rem !important; color: var(--muted) !important; border-inline-start: 2px solid var(--line); padding-inline-start: 10px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 0.75rem; color: var(--muted); background: var(--fill); padding: 3px 8px; border-radius: 6px; direction: ltr; }
  .orig { font-size: 0.8125rem; color: var(--muted); margin-top: 8px; direction: ltr; text-align: left; word-break: break-word; }
  .card[data-lang="en"] h2, .card[data-lang="en"] p:not(.why), .card[data-lang="en"] .why { direction: ltr; text-align: left; }
  .card[data-lang="en"] .why { border-inline-start: 0; border-left: 2px solid var(--line); padding-inline-start: 0; padding-left: 10px; }
  .cbtns { display: inline-flex; gap: 8px; margin-inline-start: auto; }
  .card.speaking { box-shadow: 0 0 0 2px var(--green) inset; }
  .nospeech, .no-speech .spk { display: none; }
  .imp { display: inline-flex; gap: 2px; }
  .imp i { width: 6px; height: 6px; border-radius: 50%; background: var(--fill2); display: inline-block; }
  .imp i.on { background: var(--c, var(--accent)); }

  /* Buttons: one prominent (filled) action, one tinted secondary; press states on everything */
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 0.9375rem; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; background: var(--fill); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.deep { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .btn.done { background: var(--fill); color: var(--muted); }
  .btn:active, .ib:active, .chip:active, .tab:active { opacity: .55; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.8; }
  .issue { background: var(--card); border-radius: 14px; padding: 14px; }
  .issue a { color: var(--text); text-decoration: none; font-weight: 600; }
  .issue .meta { margin-top: 6px; }
  .summary { font-size: 0.8125rem; color: var(--muted); margin-bottom: 10px; line-height: 1.7; }

  /* Read items: disclosure control near the content it hides */
  .readbox { margin-top: 20px; background: var(--card); border-radius: 14px; padding: 2px 14px; }
  .readbox summary { cursor: pointer; color: var(--muted); font-size: 0.9375rem; min-height: 44px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .readbox summary::-webkit-details-marker { display: none; }
  .readbox summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; margin-inline-end: 4px; }
  .readbox[open] summary::after { transform: rotate(225deg); }
  .stub { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.875rem; }
  .stub .t { flex: 1; color: var(--muted); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stub .t a { color: inherit; text-decoration: none; }
  .stub .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }

  /* Bottom tab bar (HIG Tab bars: navigation between peer sections, symbol + label) */
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: 0.625rem; font-weight: 500; cursor: pointer; }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-selected="true"] { color: var(--accent); }

  .toast { position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 14px; font-size: 0.9375rem; display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.3); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; min-height: 32px; }

  dialog { background: var(--card); color: var(--text); border: 0; border-radius: var(--radius); padding: 20px; max-width: 420px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.4); backdrop-filter: blur(6px); }
  dialog h3 { margin: 0 0 8px; font-size: 1.0625rem; }
  dialog p { font-size: 0.9375rem; line-height: 1.7; color: var(--text2); margin: 0 0 6px; }
  dialog input { width: 100%; background: var(--fill); color: var(--text); border: 0; border-radius: 10px; padding: 11px 12px; font: inherit; direction: ltr; margin: 8px 0; min-height: 44px; }
  dialog .row { display: flex; gap: 8px; margin-top: 12px; }
  .status { font-size: 0.8125rem; color: var(--muted); margin-top: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 8px 20px 20px; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .card, .toast, .readbox summary::after { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1 dir="ltr" style="text-align:start">AI Radar</h1><div class="sub" id="count"></div></div>
    <div class="tools">
      <select id="date" aria-label="اختر اليوم"></select>
      <button class="ib" id="global-lang" aria-label="لغة العرض">EN</button>
      <button class="ib more" id="more-btn" aria-label="المزيد" aria-haspopup="menu" aria-expanded="false"><svg class="sym" viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg></button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" id="play-all"><svg class="sym" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span class="lbl">استمع للنشرة كاملة</span></button>
        <button role="menuitem" id="gear"><svg class="sym" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path d="M17 3v4h-4M7 21v-4h4"/></svg><span>المزامنة</span><span class="st" id="menu-sync"></span></button>
      </div>
    </div>
  </div>
  <div class="filters" id="filters" role="group" aria-label="التصنيف"></div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="feed" id="feed"></div>
  <div id="readbox"></div>
</main>
<footer>يُحدَّث تلقائياً كل صباح الساعة 6:30 بتوقيت الرياض · <a id="repo-link" href="#" target="_blank">المستودع</a></footer>
<nav class="tabbar" role="tablist" aria-label="الأقسام">
  <button class="tab" role="tab" aria-selected="true" data-tab="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><span>اليوم</span></button>
  <button class="tab" role="tab" aria-selected="false" data-tab="deep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg><span>تعمّقاتي</span></button>
</nav>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">تراجع</button></div>

<dialog id="settings">
  <h3>المزامنة</h3>
  <p>الصق توكن GitHub هنا لتتزامن حالة القراءة والتعمّق بين أجهزتك.</p>
  <input type="password" id="token-input" placeholder="github_pat_..." autocomplete="off">
  <div class="status" id="sync-status"></div>
  <div class="row">
    <button class="btn primary" id="token-save">حفظ</button>
    <button class="btn" id="token-clear">إزالة</button>
    <button class="btn" id="settings-close">إغلاق</button>
  </div>
</dialog>

<script>
const REPO = (location.hostname.endsWith("github.io") && location.pathname.split("/")[1])
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}` : "AbdulazezAlamri/ai-radar";
document.getElementById("repo-link").href = `https://github.com/${REPO}`;
const STATE_BRANCH = "state", STATE_FILE = "state.json";

const I = {
  check: '<svg class="sym" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  speaker: '<svg class="sym" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  stop: '<svg class="sym" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>',
  undo: '<svg class="sym flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h9.5a5.5 5.5 0 0 1 0 11H10"/></svg>',
};
const PILLAR_AR = { models: "موديلات", tools: "أدوات", github: "GitHub", research: "أبحاث", banking: "بنوك", saudi: "السعودية", hackathon: "مسابقات", funding: "صفقات" };
const PILLAR_EN = { models: "Models", tools: "Tools", github: "GitHub", research: "Research", banking: "Banking", saudi: "Saudi", hackathon: "Contests", funding: "Deals" };
const pname = (k, lang) => ((lang || globalLang) === "en" ? PILLAR_EN : PILLAR_AR)[k] || k;
const COLORS = Object.fromEntries(Object.keys(PILLAR_AR).map(k => [k, `var(--${k})`]));
// days built before the 7-pillar scheme used: poc, tech, competition, vc
const LEGACY = { poc: "tools", tech: "models", competition: "hackathon", vc: "funding" };
const pillarOf = i => i.category === "github" ? "github" : normPillar(i.pillar);
const normPillar = p => LEGACY[p] || (PILLAR_AR[p] ? p : "models");

let state = { tab: "feed", filter: "all", day: null, dates: [] };
const ls = (k, v) => { try { return v === undefined ? JSON.parse(localStorage.getItem(k) || "null") : localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } };
let globalLang = ls("lang") || "ar";
let cardLang = {};

// ---------- Flags: last-write-wins map {id: {v, t}} for "read" and "deep" ----------
let S = ls("state2") || { read: {}, deep: {} };
(function migrate() {  // from the first version's plain sets
  const r = ls("read"), d = ls("deep"); if (!r && !d) return;
  (r || []).forEach(id => S.read[id] = S.read[id] || { v: true, t: 1 });
  (d || []).forEach(id => S.deep[id] = S.deep[id] || { v: true, t: 1 });
  ls("state2", S); localStorage.removeItem("read"); localStorage.removeItem("deep");
})();
const flag = (kind, id) => !!(S[kind][id] && S[kind][id].v);
function setFlag(kind, id, v) { S[kind][id] = { v, t: Date.now() }; ls("state2", S); sync.schedule(); }

const esc = s => (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Wrap Latin terms inside Arabic text so each stays in one piece and in reading order
const rich = s => esc(s).replace(/[A-Za-z0-9][A-Za-z0-9 .\-_/+#]*[A-Za-z0-9+#]|[A-Za-z0-9]/g,
  m => /[A-Za-z]/.test(m) ? `<span class="lt${m.length <= 20 && !m.includes(" ") ? " nb" : ""}">${m}</span>` : m);
const ago = iso => { if (!iso) return ""; const h = Math.round((Date.now() - new Date(iso)) / 36e5); return h < 1 ? "الآن" : h < 24 ? `قبل ${h} س` : `قبل ${Math.round(h / 24)} ي`; };
const b64enc = s => { const b = new TextEncoder().encode(s); let out = ""; b.forEach(c => out += String.fromCharCode(c)); return btoa(out); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

// ---------- Sync with the repo's state branch via GitHub Contents API ----------
const sync = {
  token: ls("gh_token") || "", sha: null, status: "off", timer: null, msg: "",
  api: `https://api.github.com/repos/${REPO}/contents/${STATE_FILE}?ref=${STATE_BRANCH}`,
  headers() { const h = { Accept: "application/vnd.github+json" }; if (this.token) h.Authorization = `Bearer ${this.token}`; return h; },
  set(status, msg) { this.status = status; this.msg = msg || ""; paintSync(); },
  merge(remote) {
    let changed = false;
    for (const kind of ["read", "deep"]) {
      const R = (remote && remote[kind]) || {};
      for (const id in R) { const a = S[kind][id], b = R[id]; if (!a || (b.t || 0) > (a.t || 0)) { S[kind][id] = b; changed = true; } }
    }
    if (changed) ls("state2", S);
    return changed;
  },
  async pull() {
    try {
      this.set("syncing");
      const r = await fetch(this.api, { headers: this.headers(), cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json(); this.sha = j.sha;
      const changed = this.merge(JSON.parse(b64dec(j.content || "") || "{}"));
      this.set(this.token ? "ok" : "off", this.token ? "متزامن" : "قراءة فقط، أضف توكن لحفظ التغييرات");
      return changed;
    } catch (e) { this.set(this.token ? "error" : "off", "تعذر الاتصال: " + e.message); return false; }
  },
  async push(retry = true) {
    if (!this.token) return;
    try {
      this.set("syncing");
      if (!this.sha) { const r = await fetch(this.api, { headers: this.headers(), cache: "no-store" }); if (r.ok) this.sha = (await r.json()).sha; }
      const body = { message: `state: ${new Date().toISOString()}`, branch: STATE_BRANCH, sha: this.sha,
        content: b64enc(JSON.stringify({ read: S.read, deep: S.deep, updated: new Date().toISOString() })) };
      const r = await fetch(this.api.split("?")[0], { method: "PUT", headers: { ...this.headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.status === 409 || r.status === 422) { this.sha = null; if (retry) { await this.pull(); return this.push(false); } throw new Error("تعارض"); }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      this.sha = (await r.json()).content.sha; this.set("ok", "متزامن · " + new Date().toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) { this.set("error", "فشل الحفظ: " + e.message); }
  },
  schedule() { if (!this.token) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2000); },
};
function paintSync() {
  document.getElementById("more-btn").className = "ib more s-" + sync.status;
  const msg = sync.token ? (sync.msg || "جاهز") : "لا يوجد توكن على هذا الجهاز";
  document.getElementById("sync-status").textContent = msg;
  document.getElementById("menu-sync").textContent = sync.token ? (sync.status === "ok" ? "متزامن" : sync.status === "error" ? "خطأ" : "…") : "غير مفعّلة";
}

// ---------- Data ----------
async function loadIndex() {
  try { const r = await fetch("data/index.json", { cache: "no-store" }); state.dates = (await r.json()).dates || []; } catch { state.dates = []; }
  const sel = document.getElementById("date");
  sel.innerHTML = state.dates.map((d, i) => `<option value="${d}">${i === 0 ? "اليوم · " : ""}${d.slice(5)}</option>`).join("") || `<option>لا بيانات</option>`;
  sel.onchange = () => loadDay(sel.value);
  if (state.dates[0]) await loadDay(state.dates[0]);
  else document.getElementById("feed").innerHTML = `<div class="empty">لم يتم تشغيل الجمع بعد.</div>`;
  if (await sync.pull()) render();
}
async function loadDay(d) {
  const r = await fetch(`data/${d}.json`, { cache: "no-store" });
  state.day = await r.json();
  (state.day.items || []).forEach(i => { if (LEGACY[i.pillar]) { i.poc = i.poc || i.pillar === "poc"; } i.pillar = pillarOf(i); });
  renderFilters(); render();
}
function visibleItems() {
  return (state.day?.items || []).filter(i => state.filter === "all" || i.pillar === state.filter);
}
function renderFilters() {
  const f = document.getElementById("filters"); const counts = {};
  f.dir = globalLang === "en" ? "ltr" : "rtl";
  (state.day?.items || []).filter(i => !flag("read", i.id)).forEach(i => counts[i.pillar] = (counts[i.pillar] || 0) + 1);
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  f.innerHTML = [`<button class="chip" aria-pressed="${state.filter === "all"}" data-f="all">${globalLang === "en" ? "All" : "الكل"} ${total}</button>`]
    .concat(Object.keys(PILLAR_AR).filter(k => counts[k]).map(k =>
      `<button class="chip" aria-pressed="${state.filter === k}" data-f="${k}">${pname(k)} ${counts[k]}</button>`)).join("");
  f.querySelectorAll(".chip").forEach(c => c.onclick = () => { state.filter = c.dataset.f; renderFilters(); render(); });
}
function issueUrl(it) {
  const title = `[تعمّق] ${it.title_ar || it.title}`;
  const body = [`**المصدر:** ${it.source}`, `**الرابط:** ${it.url}`, "", `**الملخص:** ${it.summary_ar || ""}`, "",
    it.why_ar ? `**لماذا يهم:** ${it.why_ar}` : "", "", "---", "## ملاحظاتي", "- [ ] قرأت المصدر الأصلي", "- [ ] جرّبته / حللته", "- [ ] الخلاصة والقرار:", ""].join("\n");
  return `https://github.com/${REPO}/issues/new?labels=deep-dive,${it.pillar}&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
function titleOf(it, lang) { return lang === "en" ? (it.title_en || it.title) : (it.title_ar || it.title); }

// ---------- Render ----------
function render() {
  const feed = document.getElementById("feed"), box = document.getElementById("readbox");
  document.getElementById("summary").textContent = "";
  if (state.tab === "deep") { box.innerHTML = ""; return renderDeep(); }
  const all = visibleItems();
  const items = all.filter(i => !flag("read", i.id)), done = all.filter(i => flag("read", i.id));
  document.getElementById("count").textContent = state.day ? (globalLang === "en" ? `${items.length} left` : `${items.length} متبقي`) : "";
  feed.innerHTML = items.length ? items.map(cardHtml).join("")
    : `<div class="empty">${all.length ? "قرأت كل شيء في هذا التصنيف ✓" : "لا توجد عناصر في هذا التصنيف اليوم."}</div>`;
  box.innerHTML = done.length ? `<details class="readbox" ${state.readOpen ? "open" : ""}><summary><span>المقروء (${done.length})</span></summary>
    ${done.map(it => `<div class="stub" style="--c:${COLORS[it.pillar] || "var(--accent)"}" data-id="${it.id}"><span class="dot"></span>
      <span class="t"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(titleOf(it, cardLang[it.id] || globalLang))}</a> <span style="opacity:.6">· ${esc(it.source)}</span></span>
      <button class="ib" data-act="unread" aria-label="أرجعها للتدفق" title="أرجعها للتدفق">${I.undo}</button></div>`).join("")}</details>` : "";
  box.querySelector("details")?.addEventListener("toggle", e => state.readOpen = e.target.open);
  box.querySelectorAll('[data-act="unread"]').forEach(b => b.onclick = () => { setFlag("read", b.closest(".stub").dataset.id, false); renderFilters(); render(); });
  feed.querySelectorAll("[data-act]").forEach(a => a.addEventListener("click", () => {
    const card = a.closest(".card"), id = card.dataset.id;
    if (a.dataset.act === "speak") return speech.toggle(id);
    if (a.dataset.act === "lang") { const cur = cardLang[id] || globalLang; cardLang[id] = cur === "en" ? "ar" : "en"; const y = scrollY; render(); scrollTo(0, y); return; }
    if (a.dataset.act === "deep") { setFlag("deep", id, true); setTimeout(render, 300); return; }
    if (a.dataset.act === "done") return markRead(card, id);
  }));
  refreshSpeechUI();
}
function cardHtml(it) {
  const c = COLORS[it.pillar] || "var(--accent)", isDeep = flag("deep", it.id);
  const lang = cardLang[it.id] || globalLang, en = lang === "en";
  const title = titleOf(it, lang);
  const summary = en ? (it.summary_en || it.snippet || it.title) : it.summary_ar;
  const why = en ? (it.why_en || "") : (it.why_ar || "");
  const other = titleOf(it, en ? "ar" : "en"); const orig = other !== title ? other : "";
  return `<article class="card" style="--c:${c}" data-id="${it.id}" data-lang="${lang}">
    <div class="meta">
      <span class="pill">${pname(it.pillar, lang)}</span>${it.poc ? `<span class="pill poc" title="يمكن تجربته">⚡ POC</span>` : ""}
      <span>${esc(it.source)}</span>
      <span>· ${ago(it.published)}</span>
      <span class="imp" title="الأهمية">${[1,2,3,4,5].map(n => `<i class="${n <= (it.importance || 3) ? "on" : ""}"></i>`).join("")}</span>
      <span class="cbtns">
        <button class="ib ${en ? "on" : ""}" data-act="lang" aria-label="${en ? "اعرض بالعربي" : "Show in English"}" title="${en ? "اعرض بالعربي" : "Show in English"}">${en ? "ع" : "EN"}</button>
        <button class="ib spk" data-act="speak" aria-label="استمع" title="استمع">${I.speaker}</button>
        <button class="ib" data-act="done" aria-label="قرأته" title="قرأته، انقلها للمقروء">${I.check}</button>
      </span>
    </div>
    <h2>${en ? esc(title) : rich(title)}</h2>
    <p>${en ? esc(summary) : rich(summary)}</p>
    ${why ? `<p class="why">${en ? esc(why) : rich(why)}</p>` : ""}
    ${(it.tags || []).length ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${orig ? `<div class="orig" style="direction:${en ? "rtl" : "ltr"};text-align:${en ? "right" : "left"}">${esc(orig)}</div>` : ""}
    <div class="actions">
      <a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener">اقرأ المصدر</a>
      <a class="btn ${isDeep ? "done" : "deep"}" href="${issueUrl(it)}" target="_blank" rel="noopener" data-act="deep">${isDeep ? "✓ في قائمة التعمّق" : "تعمّق"}</a>
    </div>
  </article>`;
}
function markRead(card, id) {
  if (speech.current === id) speech.stop();
  card.style.height = card.offsetHeight + "px"; card.offsetHeight;  // lock height, then collapse
  card.classList.add("collapsing");
  setTimeout(() => {
    setFlag("read", id, true); renderFilters(); render();
    toast("نُقلت إلى المقروء", () => { setFlag("read", id, false); renderFilters(); render(); });
  }, 300);
}
let toastTimer;
function toast(msg, undo) {
  const t = document.getElementById("toast"); document.getElementById("toast-msg").textContent = msg;
  document.getElementById("toast-undo").onclick = () => { undo && undo(); t.classList.remove("show"); };
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function renderDeep() {
  const feed = document.getElementById("feed");
  feed.innerHTML = `<div class="empty">جارٍ تحميل قائمة التعمّق من GitHub Issues…</div>`;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?labels=deep-dive&state=open&per_page=50`, { headers: { Accept: "application/vnd.github+json" } });
    const issues = (await r.json()).filter(i => !i.pull_request);
    document.getElementById("count").textContent = `${issues.length} مهمة مفتوحة`;
    document.getElementById("summary").innerHTML = `هذه المهام مفتوحة في GitHub Issues بوسم <b>deep-dive</b>. اكتب ملاحظاتك هناك وأغلق المهمة عند الانتهاء. <a href="https://github.com/${REPO}/issues?q=is%3Aissue+label%3Adeep-dive" target="_blank" style="color:var(--accent)">فتح كل القائمة</a>`;
    if (!issues.length) { feed.innerHTML = `<div class="empty">لا توجد مهام تعمّق مفتوحة.<br>اضغط "تعمّق" على أي بطاقة لإضافتها هنا.</div>`; return; }
    feed.innerHTML = issues.map(i => {
      const p = normPillar(i.labels.map(l => l.name).find(n => PILLAR_AR[n] || LEGACY[n]));
      return `<div class="issue" style="--c:${COLORS[p]}">
        <a href="${i.html_url}" target="_blank" rel="noopener">${esc(i.title.replace(/^\[تعمّق\]\s*/, ""))}</a>
        <div class="meta"><span class="pill">${pname(p)}</span><span>#${i.number}</span><span>· ${ago(i.created_at)}</span>${i.comments ? `<span>· ${i.comments} تعليق</span>` : ""}</div>
      </div>`;
    }).join("");
  } catch (e) {
    feed.innerHTML = `<div class="empty">تعذر تحميل Issues (ربما حد الطلبات).<br><a href="https://github.com/${REPO}/issues?q=is%3Aissue+label%3Adeep-dive" target="_blank" style="color:var(--accent)">افتحها في GitHub</a></div>`;
  }
}

// ---------- Speech (Web Speech API, on-device voices) ----------
const speech = {
  current: null, queue: [], voices: [],
  ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  loadVoices() { this.voices = speechSynthesis.getVoices(); },
  pickVoice(lang) {
    const want = lang === "en" ? /^en/i : /^ar/i;
    const vs = this.voices.filter(v => want.test(v.lang)); if (!vs.length) return null;
    const score = v => (lang === "ar" && /sa/i.test(v.lang) ? 4 : 0) + (/premium|enhanced|natural|neural/i.test(v.name) ? 3 : 0)
      + (/siri|google|microsoft/i.test(v.name) ? 1 : 0) + (v.localService ? 1 : 0);
    return vs.sort((a, b) => score(b) - score(a))[0];
  },
  textFor(it) {
    const lang = cardLang[it.id] || globalLang, en = lang === "en";
    const parts = en ? [it.title_en || it.title, it.summary_en || it.snippet || "", it.why_en || ""] : [it.title_ar || it.title, it.summary_ar || "", it.why_ar || ""];
    return { lang, text: parts.filter(Boolean).join(". ").replace(/\s+/g, " ") };
  },
  speak(it, onend) {
    const { lang, text } = this.textFor(it);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "en" ? "en-US" : "ar-SA"; const v = this.pickVoice(lang); if (v) u.voice = v;
    u.onend = u.onerror = () => { if (this.current === it.id) { this.current = null; onend && onend(); refreshSpeechUI(); } };
    this.current = it.id; refreshSpeechUI(); speechSynthesis.cancel(); speechSynthesis.speak(u);
  },
  stop() { this.queue = []; this.current = null; speechSynthesis.cancel(); refreshSpeechUI(); },
  toggle(id) { if (this.current === id) return this.stop(); const it = (state.day?.items || []).find(x => x.id === id); if (!it) return; this.queue = []; this.speak(it); },
  playAll() {
    if (this.queue.length || this.current) return this.stop();
    this.queue = visibleItems().filter(i => !flag("read", i.id));
    const next = () => { const it = this.queue.shift(); if (!it) return refreshSpeechUI();
      document.querySelector(`.card[data-id="${it.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); this.speak(it, next); };
    next();
  },
};
function refreshSpeechUI() {
  document.querySelectorAll(".card").forEach(c => {
    const on = c.dataset.id === speech.current; c.classList.toggle("speaking", on);
    const b = c.querySelector('[data-act="speak"]'); if (b) { b.classList.toggle("playing", on); b.innerHTML = on ? I.stop : I.speaker; }
  });
  const pa = document.getElementById("play-all"), busy = !!(speech.current || speech.queue.length);
  pa.classList.toggle("playing", busy); pa.querySelector(".lbl").textContent = busy ? "إيقاف الاستماع" : "استمع للنشرة كاملة";
}
if (speech.ok) {
  speech.loadVoices(); speechSynthesis.onvoiceschanged = () => speech.loadVoices();
  document.getElementById("play-all").onclick = () => speech.playAll();
  addEventListener("pagehide", () => speechSynthesis.cancel());
} else { document.getElementById("play-all").classList.add("nospeech"); document.documentElement.classList.add("no-speech"); }

// ---------- Header controls ----------
function paintGlobalLang() { const b = document.getElementById("global-lang"); b.textContent = globalLang === "en" ? "ع" : "EN"; b.classList.toggle("on", globalLang === "en"); }
document.getElementById("global-lang").onclick = () => { globalLang = globalLang === "en" ? "ar" : "en"; cardLang = {}; ls("lang", globalLang); paintGlobalLang(); renderFilters(); render(); };
paintGlobalLang();
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  state.tab = t.dataset.tab; document.getElementById("filters").style.display = state.tab === "feed" ? "" : "none"; render(); scrollTo(0, 0);
});
// More menu: pull-down with the rare actions
const menu = document.getElementById("menu"), moreBtn = document.getElementById("more-btn");
function showMenu(v) { menu.hidden = !v; moreBtn.setAttribute("aria-expanded", v); }
moreBtn.onclick = e => { e.stopPropagation(); showMenu(menu.hidden); };
document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) showMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") showMenu(false); });
menu.querySelectorAll("button").forEach(b => b.addEventListener("click", () => showMenu(false)));
const dlg = document.getElementById("settings");
document.getElementById("gear").onclick = () => { document.getElementById("token-input").value = sync.token; paintSync(); dlg.showModal(); };
document.getElementById("settings-close").onclick = () => dlg.close();
document.getElementById("token-save").onclick = async () => {
  const t = document.getElementById("token-input").value.trim(); if (!t) return;
  sync.token = t; ls("gh_token", t); sync.sha = null;
  const changed = await sync.pull(); if (sync.status === "ok") { await sync.push(); if (changed) { renderFilters(); render(); } }
};
document.getElementById("token-clear").onclick = () => { sync.token = ""; localStorage.removeItem("gh_token"); sync.set("off"); document.getElementById("token-input").value = ""; };
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && state.day && await sync.pull()) { renderFilters(); render(); } });
paintSync();
loadIndex();
</script>
